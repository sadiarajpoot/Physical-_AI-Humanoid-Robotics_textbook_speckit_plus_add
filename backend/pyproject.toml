[project]
name = "book-embeddings-ingestion"
version = "0.1.0"
description = "Tool to crawl Docusaurus book pages, generate Cohere embeddings, and store in Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.0.0",
    "qdrant-client>=1.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "langchain-text-splitters>=0.0.1",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
book-ingest = "main:main"

[tool.setuptools]
py-modules = ["main", "models", "config", "utils", "exceptions", "cli", "logger", "parsers", "crawler", "chunker", "embedders", "vector_store", "verifier", "resumer", "validators"]